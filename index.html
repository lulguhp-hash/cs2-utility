<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <title>CS2 Utility — раскидки</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">CS<span>2</span></div>
      <div><div class="eyebrow">UTILITY DATABASE</div><h1>РАСКИДКИ</h1></div>
      <button id="favToggle" class="icon-btn" aria-label="Избранное">☆</button>
    </header>

    <section class="hero">
      <div class="hero-kicker">ТВОЯ ТАКТИЧЕСКАЯ БАЗА</div>
      <h2>Каждая граната.<br><span>Каждая карта.</span></h2>
      <p>Находи смоки, флешки, молотовы и HE для своей стороны.</p>
    </section>

    <label class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Поиск карты или раскидки…" autocomplete="off"></label>

    <nav class="tabs" aria-label="Тип гранаты">
      <button class="tab active" data-type="all">Все</button>
      <button class="tab" data-type="smoke">Смоки</button>
      <button class="tab" data-type="flash">Флешки</button>
      <button class="tab" data-type="molotov">Молотовы</button>
      <button class="tab" data-type="he">HE</button>
    </nav>

    <section class="filters">
      <div class="filter-label">СТОРОНА</div>
      <div class="segmented">
        <button class="side active" data-side="all">Все</button>
        <button class="side" data-side="T">T</button>
        <button class="side" data-side="CT">CT</button>
      </div>
      <div class="filter-label map-label">КАРТА</div>
      <select id="mapSelect" aria-label="Выбрать карту"><option value="all">Все карты</option></select>
    </section>

    <div class="section-heading">
      <div><div class="eyebrow">БИБЛИОТЕКА</div><h2 id="listTitle">Популярные карты</h2></div>
      <span id="count" class="count">0 карт</span>
    </div>
    <div id="mapGrid" class="map-grid"></div>

    <section id="lineupsSection" class="lineups-section" hidden>
      <button id="backToMaps" class="back-link">← Все карты</button>
      <div class="map-detail-head"><div class="eyebrow">КАРТА</div><h2 id="detailMapName"></h2><p id="detailMapDesc"></p></div>
      <div class="lineup-controls">
        <input id="lineupSearch" type="search" placeholder="Найти раскидку…">
        <select id="positionSelect"><option value="all">Все позиции</option></select>
      </div>
      <div id="lineupList"></div>
    </section>

    <footer><span class="brand-mark small">CS<span>2</span></span><span>COMMUNITY TACTICAL TOOL</span></
footer>
    </div> 
  <script src="data.js?v=100"></script>
<script src="media-v07.js?v=101"></script>
<script src="app-v07.js?v=090"></script>
</body>
</html>
